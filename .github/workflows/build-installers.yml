        with:
          name: pulvis-macos-x64-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PULVIS_TASK_ROOT }}/logs/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove this macOS Intel build task directory
        if: always()
        run: node scripts/cleanup-build-task.mjs "$PULVIS_TASK_ROOT" "$RUNNER_TEMP" desktop "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" macos-x64

  linux:
    name: Linux amd64 Debian package
    runs-on: ubuntu-22.04
    env:
      PULVIS_TASK_KIND: desktop
      PULVIS_TASK_LABEL: linux-x64
      PULVIS_KEEP_BUILD_TEMP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build task paths
        run: |
          TASK_ROOT="$RUNNER_TEMP/pulvis-$PULVIS_TASK_KIND-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PULVIS_TASK_LABEL"
          echo "PULVIS_TASK_ROOT=$TASK_ROOT" >> "$GITHUB_ENV"
          echo "PULVIS_BUILD_LOG_FILE=$TASK_ROOT/logs/build.log" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release inputs
        run: |
          node scripts/sync-version.mjs
          node scripts/build-modules.mjs
          node scripts/verify-icons.mjs
          node scripts/package-smoke.mjs

      - name: Build, verify and stage Debian package plus SHA-256
        run: node scripts/build-linux-deb.mjs "$PULVIS_TASK_ROOT/artifacts"

      - name: Upload verified Linux package
        uses: actions/upload-artifact@v4
        with:
          name: pulvis-linux-x64-v0.0.5
          path: ${{ env.PULVIS_TASK_ROOT }}/artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pulvis-linux-x64-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PULVIS_TASK_ROOT }}/logs/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove this Linux build task directory
        if: always()
        run: node scripts/cleanup-build-task.mjs "$PULVIS_TASK_ROOT" "$RUNNER_TEMP" desktop "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" linux-x64

  source:
    name: Source archive
    runs-on: ubuntu-22.04
    env:
      PULVIS_TASK_KIND: source
      PULVIS_TASK_LABEL: archive
      PULVIS_KEEP_BUILD_TEMP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build task paths
        run: |
          TASK_ROOT="$RUNNER_TEMP/pulvis-$PULVIS_TASK_KIND-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PULVIS_TASK_LABEL"
          echo "PULVIS_TASK_ROOT=$TASK_ROOT" >> "$GITHUB_ENV"
          echo "PULVIS_BUILD_LOG_FILE=$TASK_ROOT/logs/build.log" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package committed source and verify SHA-256
        run: node scripts/package-source.mjs "$GITHUB_SHA" "$PULVIS_TASK_ROOT/artifacts"

      - name: Upload verified source archive
        uses: actions/upload-artifact@v4
        with:
          name: pulvis-source-v0.0.5
          path: ${{ env.PULVIS_TASK_ROOT }}/artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload source build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pulvis-source-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PULVIS_TASK_ROOT }}/logs/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove this source build task directory
        if: always()
        run: node scripts/cleanup-build-task.mjs "$PULVIS_TASK_ROOT" "$RUNNER_TEMP" source "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" archive

  release-bundle:
    name: Assemble SHA256SUMS and release bundle
    needs: [windows-x64, windows-arm64, macos-arm64, macos-x64, linux, source]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all verified packages
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/pulvis-release-v0.0.5
          merge-multiple: true

      - name: Generate and verify SHA256SUMS.txt
        run: node scripts/write-release-checksums.mjs "$RUNNER_TEMP/pulvis-release-v0.0.5"

      - name: Upload complete release bundle
        uses: actions/upload-artifact@v4
        with:
          name: pulvis-release-v0.0.5
          path: ${{ runner.temp }}/pulvis-release-v0.0.5/*
          if-no-files-found: error
          retention-days: 30
