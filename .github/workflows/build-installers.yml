          "PULVIS_TASK_ROOT=$taskRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PULVIS_BUILD_LOG_FILE=$(Join-Path $taskRoot 'logs/build.log')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release inputs
        run: node -e "const fs=require('node:fs'),c=require('node:crypto'),m=JSON.parse(fs.readFileSync('_manifest.sha256.json','utf8'));for(const[f,h]of Object.entries(m.files)){const b=fs.readFileSync(f),g=c.createHash('sha256').update(b).digest('hex');if(g!==h)throw new Error('SHA-256 mismatch: '+f+' (expected '+h.slice(0,12)+', got '+g.slice(0,12)+', bytes='+b.length+')')}console.log('Verified _manifest.sha256.json:',Object.keys(m.files).length,'files')"

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup.7 -e --silent --accept-package-agreements --accept-source-agreements
          $candidates = @(
            (Join-Path $env:ProgramFiles 'Inno Setup 7'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 7'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 7')
          )
          $installDir = $candidates | Where-Object { $_ -and (Test-Path -LiteralPath (Join-Path $_ 'ISCC.exe')) } | Select-Object -First 1
          if (-not $installDir) {
            throw 'Inno Setup 7 compiler (ISCC.exe) was not found after winget install.'
          }
          "INNO_SETUP_HOME=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build, verify and stage Windows ARM64 installer plus SHA-256
        shell: pwsh
        run: node scripts/build-windows-installer.mjs --arch=arm64 (Join-Path $env:PULVIS_TASK_ROOT 'artifacts')

      - name: Upload verified Windows ARM64 installer
        uses: actions/upload-artifact@v4
        with:
          name: pulvis-windows-arm64-v0.0.6
          path: ${{ env.PULVIS_TASK_ROOT }}/artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows ARM64 build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pulvis-windows-arm64-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PULVIS_TASK_ROOT }}/logs/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove this Windows ARM64 build task directory
        if: always()
        shell: pwsh
        run: node scripts/cleanup-build-task.mjs $env:PULVIS_TASK_ROOT $env:RUNNER_TEMP desktop $env:GITHUB_RUN_ID $env:GITHUB_RUN_ATTEMPT windows-arm64

  macos-arm64:
    name: macOS Apple Silicon (arm64) PKG
    runs-on: macos-latest
    env:
      PULVIS_TASK_KIND: desktop
      PULVIS_TASK_LABEL: macos-arm64
      PULVIS_KEEP_BUILD_TEMP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build task paths
        run: |
          TASK_ROOT="$RUNNER_TEMP/pulvis-$PULVIS_TASK_KIND-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PULVIS_TASK_LABEL"
          echo "PULVIS_TASK_ROOT=$TASK_ROOT" >> "$GITHUB_ENV"
          echo "PULVIS_BUILD_LOG_FILE=$TASK_ROOT/logs/build.log" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release inputs
        run: node -e "const fs=require('node:fs'),c=require('node:crypto'),m=JSON.parse(fs.readFileSync('_manifest.sha256.json','utf8'));for(const[f,h]of Object.entries(m.files)){const b=fs.readFileSync(f),g=c.createHash('sha256').update(b).digest('hex');if(g!==h)throw new Error('SHA-256 mismatch: '+f+' (expected '+h.slice(0,12)+', got '+g.slice(0,12)+', bytes='+b.length+')')}console.log('Verified _manifest.sha256.json:',Object.keys(m.files).length,'files')"

      - name: Build, verify and stage macOS Apple Silicon PKG plus SHA-256
        run: node scripts/build-macos-pkg.mjs --arch=arm64 "$PULVIS_TASK_ROOT/artifacts"

      - name: Upload verified macOS Apple Silicon package
        uses: actions/upload-artifact@v4
        with:
          name: pulvis-macos-arm64-v0.0.6
          path: ${{ env.PULVIS_TASK_ROOT }}/artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS Apple Silicon build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pulvis-macos-arm64-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PULVIS_TASK_ROOT }}/logs/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove this macOS Apple Silicon build task directory
        if: always()
        run: node scripts/cleanup-build-task.mjs "$PULVIS_TASK_ROOT" "$RUNNER_TEMP" desktop "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" macos-arm64

  macos-x64:
    name: macOS Intel (x64) PKG
    runs-on: macos-latest
    env:
      PULVIS_TASK_KIND: desktop
      PULVIS_TASK_LABEL: macos-x64
      PULVIS_KEEP_BUILD_TEMP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build task paths
        run: |
          TASK_ROOT="$RUNNER_TEMP/pulvis-$PULVIS_TASK_KIND-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PULVIS_TASK_LABEL"
          echo "PULVIS_TASK_ROOT=$TASK_ROOT" >> "$GITHUB_ENV"
          echo "PULVIS_BUILD_LOG_FILE=$TASK_ROOT/logs/build.log" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release inputs
        run: node -e "const fs=require('node:fs'),c=require('node:crypto'),m=JSON.parse(fs.readFileSync('_manifest.sha256.json','utf8'));for(const[f,h]of Object.entries(m.files)){const b=fs.readFileSync(f),g=c.createHash('sha256').update(b).digest('hex');if(g!==h)throw new Error('SHA-256 mismatch: '+f+' (expected '+h.slice(0,12)+', got '+g.slice(0,12)+', bytes='+b.length+')')}console.log('Verified _manifest.sha256.json:',Object.keys(m.files).length,'files')"

      - name: Build, verify and stage macOS Intel PKG plus SHA-256
        run: node scripts/build-macos-pkg.mjs --arch=x64 "$PULVIS_TASK_ROOT/artifacts"

      - name: Upload verified macOS Intel package
        uses: actions/upload-artifact@v4
        with:
          name: pulvis-macos-x64-v0.0.6
          path: ${{ env.PULVIS_TASK_ROOT }}/artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS Intel build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pulvis-macos-x64-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PULVIS_TASK_ROOT }}/logs/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove this macOS Intel build task directory
        if: always()
        run: node scripts/cleanup-build-task.mjs "$PULVIS_TASK_ROOT" "$RUNNER_TEMP" desktop "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" macos-x64

  linux:
    name: Linux amd64 Debian package
    runs-on: ubuntu-22.04
    env:
      PULVIS_TASK_KIND: desktop
      PULVIS_TASK_LABEL: linux-x64
      PULVIS_KEEP_BUILD_TEMP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build task paths
        run: |
          TASK_ROOT="$RUNNER_TEMP/pulvis-$PULVIS_TASK_KIND-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PULVIS_TASK_LABEL"
          echo "PULVIS_TASK_ROOT=$TASK_ROOT" >> "$GITHUB_ENV"
          echo "PULVIS_BUILD_LOG_FILE=$TASK_ROOT/logs/build.log" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release inputs
        run: node -e "const fs=require('node:fs'),c=require('node:crypto'),m=JSON.parse(fs.readFileSync('_manifest.sha256.json','utf8'));for(const[f,h]of Object.entries(m.files)){const b=fs.readFileSync(f),g=c.createHash('sha256').update(b).digest('hex');if(g!==h)throw new Error('SHA-256 mismatch: '+f+' (expected '+h.slice(0,12)+', got '+g.slice(0,12)+', bytes='+b.length+')')}console.log('Verified _manifest.sha256.json:',Object.keys(m.files).length,'files')"

      - name: Build, verify and stage Debian package plus SHA-256
        run: node scripts/build-linux-deb.mjs "$PULVIS_TASK_ROOT/artifacts"

      - name: Upload verified Linux package
        uses: actions/upload-artifact@v4
        with:
          name: pulvis-linux-x64-v0.0.6
          path: ${{ env.PULVIS_TASK_ROOT }}/artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pulvis-linux-x64-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PULVIS_TASK_ROOT }}/logs/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove this Linux build task directory
        if: always()
        run: node scripts/cleanup-build-task.mjs "$PULVIS_TASK_ROOT" "$RUNNER_TEMP" desktop "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" linux-x64

  source:
    name: Source archive
    runs-on: ubuntu-22.04
    env:
      PULVIS_TASK_KIND: source
      PULVIS_TASK_LABEL: archive
      PULVIS_KEEP_BUILD_TEMP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build task paths
        run: |
          TASK_ROOT="$RUNNER_TEMP/pulvis-$PULVIS_TASK_KIND-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PULVIS_TASK_LABEL"
          echo "PULVIS_TASK_ROOT=$TASK_ROOT" >> "$GITHUB_ENV"
          echo "PULVIS_BUILD_LOG_FILE=$TASK_ROOT/logs/build.log" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package committed source and verify SHA-256
        run: node scripts/package-source.mjs "$GITHUB_SHA" "$PULVIS_TASK_ROOT/artifacts"

      - name: Upload verified source archive
        uses: actions/upload-artifact@v4
        with:
          name: pulvis-source-v0.0.6
          path: ${{ env.PULVIS_TASK_ROOT }}/artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload source build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pulvis-source-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PULVIS_TASK_ROOT }}/logs/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove this source build task directory
        if: always()
        run: node scripts/cleanup-build-task.mjs "$PULVIS_TASK_ROOT" "$RUNNER_TEMP" source "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" archive

  release-bundle:
    name: Assemble SHA256SUMS and release bundle
    needs: [windows-x64, windows-arm64, macos-arm64, macos-x64, linux, source]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all verified packages
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/pulvis-release-v0.0.6
          merge-multiple: true

      - name: Generate and verify SHA256SUMS.txt
        run: node scripts/write-release-checksums.mjs "$RUNNER_TEMP/pulvis-release-v0.0.6"

      - name: Upload complete release bundle
        uses: actions/upload-artifact@v4
        with:
          name: pulvis-release-v0.0.6
          path: ${{ runner.temp }}/pulvis-release-v0.0.6/*
          if-no-files-found: error
          retention-days: 30
