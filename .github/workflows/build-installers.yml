          $taskRoot = Join-Path $env:RUNNER_TEMP "pulvis-$env:PULVIS_TASK_KIND-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:PULVIS_TASK_LABEL"
          "PULVIS_TASK_ROOT=$taskRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PULVIS_BUILD_LOG_FILE=$(Join-Path $taskRoot 'logs/build.log')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release inputs
        run: |
          node scripts/sync-version.mjs
          node scripts/build-modules.mjs
          node scripts/verify-icons.mjs
          node scripts/package-smoke.mjs

      - name: Install Inno Setup 7.1.1
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          Invoke-WebRequest -Uri 'https://files.jrsoftware.org/is/7/innosetup-7.1.1-x64.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Pyrsys B.V.*') {
            throw 'The Inno Setup compiler signature is invalid.'
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'InnoSetup7'
          Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir") -Wait
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'ISCC.exe'))) {
            throw 'Inno Setup 7.1.1 compiler was not installed.'
          }
          "INNO_SETUP_HOME=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build, verify and stage Windows ARM64 installer plus SHA-256
        shell: pwsh
        run: node scripts/build-windows-installer.mjs --arch=arm64 (Join-Path $env:PULVIS_TASK_ROOT 'artifacts')

      - name: Upload verified Windows ARM64 installer
        uses: actions/upload-artifact@v4
        with:
          name: pulvis-windows-arm64-v0.0.5
          path: ${{ env.PULVIS_TASK_ROOT }}/artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows ARM64 build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pulvis-windows-arm64-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PULVIS_TASK_ROOT }}/logs/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove this Windows ARM64 build task directory
        if: always()
        shell: pwsh
        run: node scripts/cleanup-build-task.mjs $env:PULVIS_TASK_ROOT $env:RUNNER_TEMP desktop $env:GITHUB_RUN_ID $env:GITHUB_RUN_ATTEMPT windows-arm64

  macos-arm64:
    name: macOS Apple Silicon (arm64) PKG
    runs-on: macos-latest
    env:
      PULVIS_TASK_KIND: desktop
      PULVIS_TASK_LABEL: macos-arm64
      PULVIS_KEEP_BUILD_TEMP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build task paths
        run: |
          TASK_ROOT="$RUNNER_TEMP/pulvis-$PULVIS_TASK_KIND-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PULVIS_TASK_LABEL"
          echo "PULVIS_TASK_ROOT=$TASK_ROOT" >> "$GITHUB_ENV"
          echo "PULVIS_BUILD_LOG_FILE=$TASK_ROOT/logs/build.log" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release inputs
        run: |
          node scripts/sync-version.mjs
          node scripts/build-modules.mjs
          node scripts/verify-icons.mjs
          node scripts/package-smoke.mjs

      - name: Build, verify and stage macOS Apple Silicon PKG plus SHA-256
        run: node scripts/build-macos-pkg.mjs --arch=arm64 "$PULVIS_TASK_ROOT/artifacts"

      - name: Upload verified macOS Apple Silicon package
        uses: actions/upload-artifact@v4
        with:
          name: pulvis-macos-arm64-v0.0.5
          path: ${{ env.PULVIS_TASK_ROOT }}/artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS Apple Silicon build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pulvis-macos-arm64-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PULVIS_TASK_ROOT }}/logs/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove this macOS Apple Silicon build task directory
        if: always()
        run: node scripts/cleanup-build-task.mjs "$PULVIS_TASK_ROOT" "$RUNNER_TEMP" desktop "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" macos-arm64

  macos-x64:
    name: macOS Intel (x64) PKG
    runs-on: macos-latest
    env:
      PULVIS_TASK_KIND: desktop
      PULVIS_TASK_LABEL: macos-x64
      PULVIS_KEEP_BUILD_TEMP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build task paths
        run: |
          TASK_ROOT="$RUNNER_TEMP/pulvis-$PULVIS_TASK_KIND-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PULVIS_TASK_LABEL"
          echo "PULVIS_TASK_ROOT=$TASK_ROOT" >> "$GITHUB_ENV"
          echo "PULVIS_BUILD_LOG_FILE=$TASK_ROOT/logs/build.log" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release inputs
        run: |
          node scripts/sync-version.mjs
          node scripts/build-modules.mjs
          node scripts/verify-icons.mjs
          node scripts/package-smoke.mjs

      - name: Build, verify and stage macOS Intel PKG plus SHA-256
        run: node scripts/build-macos-pkg.mjs --arch=x64 "$PULVIS_TASK_ROOT/artifacts"

      - name: Upload verified macOS Intel package
        uses: actions/upload-artifact@v4
        with:
          name: pulvis-macos-x64-v0.0.5
          path: ${{ env.PULVIS_TASK_ROOT }}/artifacts/*
          if-no-files-found: error
